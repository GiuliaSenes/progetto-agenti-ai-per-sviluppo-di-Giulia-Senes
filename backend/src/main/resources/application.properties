server.port=${PORT:8080}

# Chiavi locali (file non versionato, vedi secrets.properties.example)
spring.config.import=optional:file:./secrets.properties

# --- Persistenza: H2 su file di default; in produzione imposta SPRING_DATASOURCE_URL (PostgreSQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/chatdb;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- LLM (qualsiasi API compatibile OpenAI: OpenAI, Groq, Gemini, OpenRouter...) ---
llm.base-url=${LLM_BASE_URL:https://api.groq.com/openai/v1}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:openai/gpt-oss-120b}
llm.history-limit=30

# --- EcoFreight ---
ecofreight.base-url=${ECOFREIGHT_BASE_URL:https://api.ecofreight.co/api/v1}
ecofreight.api-key=${ECOFREIGHT_API_KEY:}

# --- CORS (origine del frontend) ---
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
